name: Main CI
on:
  push:
    branches:
      - '**'  # Runs on push to any branch
  release:
    types: [ created ]  # Runs when a new release is created

# only one job should run at a time when deploying
concurrency:
  group: ${{github.workflow}}-${{ github.ref_name != 'main' && !contains(github.event.head_commit.message, '[pulumi up]') && github.ref_name || 'deploying' }}
  cancel-in-progress: false

jobs:
  frontend-ci:
    uses: ./.github/workflows/frontend-ci.yml
    secrets: inherit
    with:
      upload-artifacts: ${{ (github.event_name == 'push' && (github.ref_name == github.event.repository.default_branch || contains(fromJSON(vars.ARTIFACT_UPLOAD_BRANCHES || '[]'), github.ref_name) || contains(github.event.head_commit.message, '[pulumi up]'))) }}

  admin-frontend-ci:
    uses: ./.github/workflows/admin-frontend-ci.yml
    secrets: inherit
    with:
      upload-artifacts: ${{ (github.event_name == 'push' && (github.ref_name == github.event.repository.default_branch || contains(fromJSON(vars.ARTIFACT_UPLOAD_BRANCHES || '[]'), github.ref_name) || contains(github.event.head_commit.message, '[pulumi up]'))) }}

  backend-ci:
    uses: ./.github/workflows/backend-ci.yml
    secrets: inherit
    with:
      upload-artifacts: ${{ (github.event_name == 'push' && (github.ref_name == github.event.repository.default_branch || contains(fromJSON(vars.ARTIFACT_UPLOAD_BRANCHES || '[]'), github.ref_name) || contains(github.event.head_commit.message, '[pulumi up]'))) }}

  config-ci:
    uses: ./.github/workflows/config-ci.yml
    secrets: inherit
    if: ${{ (github.event_name == 'push' && (github.ref_name == github.event.repository.default_branch || contains(fromJSON(vars.ARTIFACT_UPLOAD_BRANCHES || '[]'), github.ref_name) || contains(github.event.head_commit.message, '[pulumi up]'))) }}

  # Deploys only where a repository has said which environment is its own. A fork that
  # sets nothing builds and publishes but deploys nowhere, rather than deploying into
  # whichever environment happened to be named in this file.
  deploy:
    needs: [ frontend-ci, admin-frontend-ci, backend-ci, config-ci ]
    if: ${{ vars.CI_DEPLOY_ENV_NAME != '' && (github.event_name == 'push' && (github.ref_name == github.event.repository.default_branch || contains(fromJSON(vars.ARTIFACT_UPLOAD_BRANCHES || '[]'), github.ref_name) || contains(github.event.head_commit.message, '[pulumi up]'))) }}
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
    with:
      env-name: ${{ vars.CI_DEPLOY_ENV_NAME }}
      env-type: ${{ vars.CI_DEPLOY_ENV_TYPE }}
      target-git-sha: ${{ github.sha }}
      target-git-branch: ${{ github.ref_name }}
