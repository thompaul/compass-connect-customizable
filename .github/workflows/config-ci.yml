name: Upload configurations and templates

on:
  workflow_call:
    inputs:
      artifacts-project:
        required: false
        type: string
        default: ''
        description: >
          The Google Cloud project whose Artifact Registry receives the build. Empty means the
          realm's own root project, which is what every existing caller gets and what this
          repository has always done. Set it to a project that publishes the product for
          everyone, so that a deployment can run artifacts it did not build.

jobs:
  upload-templates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to google cloud
        id: auth
        uses: google-github-actions/auth@v2.1.2
        with:
          # Publishing is not an environment tier. This credential writes to a root
          # project's Artifact Registry, which is neither a lower nor an upper environment, and
          # naming it for one made every caller supply a credential whose name contradicted its
          # job. GCP_ARTIFACTS_SERVICE_ACCOUNT_JSON says what it is for; the old name is still
          # read, so a repository that has only set that one keeps working.
          credentials_json:
            ${{ secrets.GCP_ARTIFACTS_SERVICE_ACCOUNT_JSON || secrets.GCP_LOWER_ENVS_SERVICE_ACCOUNT_JSON }}

      - name: upload templates
        working-directory: iac
        run: |
          ./scripts/upload-templates.sh ${{ vars.ARTIFACT_REGISTRY_REGION }} ${{ inputs.artifacts-project || secrets.GCP_REALM_ROOT_PROJECT_ID }}
