name: Backend CI & Artifact Upload

on:
  workflow_call:
    inputs:
      upload-artifacts:
        required: true
        type: boolean
        description: 'Whether to upload deployable artifacts'
      artifacts-project:
        required: false
        type: string
        default: ''
        description: >
          The Google Cloud project whose Artifact Registry receives the build. Empty means the
          realm's own root project, which is what every existing caller gets and what this
          repository has always done. Set it to a project that publishes the product for
          everyone, so that a deployment can run artifacts it did not build.

jobs:
  test-build-and-upload:
    runs-on: ubuntu-latest
    steps:
      # setup.

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Load cached Poetry installation
        id: cached-poetry
        uses: actions/cache@v4
        with:
          path: ~/.local
          key: poetry-0

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 1.8.5

      - name: Load cached Poetry cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          key: poetry-cache-${{ runner.os }}-${{ steps.setup_python.outputs.python-version }}-${{ env.POETRY_VERSION }}

      - name: Install dependencies
        shell: bash
        run: |
          poetry lock --no-update --no-interaction
          poetry install --no-interaction
        working-directory: backend

      # test and lint

      - name: Linting Bandit
        shell: bash
        run: poetry run bandit -c bandit.yaml -r .
        working-directory: backend

      - name: Linting Pylint
        shell: bash
        # Do not fail the build if linting errors (--exit-zero)
        # Once we have fixed all the linting errors, we can remove this flag.
        run: poetry run pylint --exit-zero --recursive=y .
        working-directory: backend

      - name: Run unit tests
        shell: bash
        run: poetry run pytest -m 'not (evaluation_test or smoke_test or llm_integration)'
        working-directory: backend

      # generate offline vignettes for deployment
      - name: Generate offline vignettes
        shell: bash
        run: |
          poetry run python app/agent/preference_elicitation_agent/offline_optimization/run_offline_optimization.py \
            --output-dir offline_output \
            --config app/agent/preference_elicitation_agent/offline_optimization/preference_parameters.json
        working-directory: backend

      # build and upload artifacts

      - name: Authenticate to google cloud
        if: ${{ inputs.upload-artifacts }}
        uses: google-github-actions/auth@v2.1.2
        with:
          # Publishing is not an environment tier. This credential writes to a root
          # project's Artifact Registry, which is neither a lower nor an upper environment, and
          # naming it for one made every caller supply a credential whose name contradicted its
          # job. GCP_ARTIFACTS_SERVICE_ACCOUNT_JSON says what it is for; the old name is still
          # read, so a repository that has only set that one keeps working.
          credentials_json:
            ${{ secrets.GCP_ARTIFACTS_SERVICE_ACCOUNT_JSON || secrets.GCP_LOWER_ENVS_SERVICE_ACCOUNT_JSON }}

      - name: Run build and upload script.
        shell: bash
        if: ${{ inputs.upload-artifacts }}
        run: |
          ./iac/scripts/build-and-upload-be.sh ${{ vars.ARTIFACT_REGISTRY_REGION }} ${{ inputs.artifacts-project || secrets.GCP_REALM_ROOT_PROJECT_ID }} $GITHUB_STEP_SUMMARY $GITHUB_RUN_NUMBER
